[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "tau-ai"
version = "0.4.8"
description = "A Python implementation of a minimalist Pi-style coding-agent harness."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.0",
    "fastapi>=0.115",
    "httpx[socks]>=0.27",
    "packaging>=24.0",
    "pillow>=11.0",
    "pydantic>=2.11",
    "pygments>=2.18",
    "typer>=0.12",
    "uvicorn>=0.32",
]

[project.urls]
Homepage = "https://twotimespi.dev"
Documentation = "https://twotimespi.dev"
Repository = "https://github.com/huggingface/tau"
Issues = "https://github.com/huggingface/tau/issues"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/entity", "src/model", "src/agent", "src/application", "src/server"]

[tool.hatch.build.targets.wheel.force-include]
"frontend/index.html" = "server/static/index.html"
"frontend/app.js" = "server/static/app.js"
"frontend/app.css" = "server/static/app.css"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["entity", "model", "agent", "application", "server"]

[[tool.mypy.overrides]]
module = "pygments.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
